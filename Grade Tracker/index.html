<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Grade Tracker</h1>
        <div class="input-section">
            <input type="text" id="subject-input" placeholder="Subject name">
            <input type="number" id="grade-input" placeholder="Grade (0-100)" min="0" max="100">
            <button id="add-btn" onclick="addGrade()">Add Grade</button>
        </div>
        <div class="stats">
            <h2>Statistics</h2>
            <p>Total Subjects: <span id="total-subjects">0</span></p>
            <p>Average Grade: <span id="average-grade">0</span></p>
        </div>
        <div class="grades-list">
            <h2>Your Grades</h2>
            <ul id="grades-display"></ul>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
